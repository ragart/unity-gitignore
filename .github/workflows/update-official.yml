name: Update official Unity gitignore

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout official Unity gitignore
        uses: actions/checkout@v7
        with:
          repository: github/gitignore
          path: upstream
          sparse-checkout: |
            Unity.gitignore
          sparse-checkout-cone-mode: false

      - name: Update official copy
        run: |
          cp upstream/Unity.gitignore Unity.gitignore-official
          rm -rf upstream

      - name: Commit changes
        run: |
          if git diff --quiet Unity.gitignore-official; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Unity.gitignore-official
          git commit -m "Update official Unity .gitignore"
          git push